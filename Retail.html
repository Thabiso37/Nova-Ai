<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101526">
<title>Official Retail Market | NOVAAI</title>
<style>
:root{--bg:#f5f7fb;--ink:#171c2d;--muted:#70778b;--p:#174ea6;--dark:#10284b;--line:#e1e6ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}
button,input,select{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.top{background:var(--dark);color:white;text-align:center;padding:10px;font-size:12px;font-weight:700}
header{background:white;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);padding:15px 20px}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900;color:var(--p)}
.logo span{color:#f5b900}
main{max-width:1200px;margin:24px auto;padding:0 20px}
.banner{background:linear-gradient(120deg,#10284b,#174ea6 72%,#3878cf);color:white;border-radius:18px;padding:30px;margin-bottom:24px;box-shadow:0 8px 24px rgba(16,40,75,.12)}
.banner h1{margin:0 0 10px;font-size:28px}
.banner p{color:#e0dfff;margin:0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.product{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(20,40,70,.04);transition:transform .2s,box-shadow .2s}
.product:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,40,70,.12)}
.prodimg{height:190px;background:#f8f9fa;position:relative}
.prodimg img{width:100%;height:100%;object-fit:cover}
.shein-discount-badge{position:absolute;bottom:8px;left:8px;background:#e11d48;color:white;font-size:11px;font-weight:800;padding:3px 7px;border-radius:4px}
.prodbody{padding:12px;display:flex;flex:1;flex-direction:column}
.prodbody h3{font-size:13px;margin:4px 0 6px;font-weight:700}
.price{font-size:18px;font-weight:900;color:#17345b;margin-top:auto}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;background:var(--p);color:white;width:100%;margin-top:10px}
.back-btn{background:#f0f4f9;color:#174ea6;border:1px solid #d1dced;width:auto;padding:8px 14px}
.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#171b2d;color:white;padding:12px 16px;border-radius:10px;z-index:100}
.hidden{display:none!important}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="top">🇿🇦 NOVA AI TRUST SHIELD · OFFICIAL CORPORATE RETAIL PARTNERS</div>
<header>
  <div class="head">
    <a class="logo" href="index.html">NOVA<span>AI</span> RETAIL</a>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="index.html?view=cart" class="back-btn" style="display:inline-block;">🛒 Cart (<span id="cartCount">0</span>)</a>
      <a href="index.html" class="btn back-btn">← Back to Marketplace</a>
    </div>
  </div>
</header>

<main>
  <div class="banner">
    <h1>🛍️ Official Retail Market</h1>
    <p>Browse verified, authentic stock directly from South Africa's trusted major retail brands like Nike, Puma, Pick n Pay, and more.</p>
  </div>

  <div class="grid" id="retailGrid"></div>
</main>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";
const retailProducts = [
  {id: "retail-1", name: "Nike Air Max Trainer", category: "Clothing Shoes & Accessories", price: 1899, seller: "Nike Official Store", description: "Official Nike athletic footwear and streetwear.", images: ["https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"], discount: "20%"},
  {id: "retail-2", name: "Puma Running Hoodie", category: "Clothing Shoes & Accessories", price: 899, seller: "Puma Retail", description: "Comfortable activewear hoodie designed for peak performance.", images: ["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"], discount: "15%"},
  {id: "retail-3", name: "Pick n Pay Grocery Basket Bundle", category: "Groceries", price: 450, seller: "Pick n Pay Hyper", description: "Household essentials and grocery bundle pack.", images: ["https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=700&q=80"], discount: "10%"}
];

function cash(n){return new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR"}).format(n)}

function readCart(){try{return JSON.parse(localStorage.getItem("novaMarketplaceCartV1")||"[]")}catch(e){return []}}
function saveCart(cart){try{localStorage.setItem("novaMarketplaceCartV1",JSON.stringify(cart))}catch(e){}}

function updateCartCount(){
  const cart = readCart();
  document.getElementById("cartCount").textContent = cart.reduce((s,i)=>s+i.qty,0);
}

function addToRetailCart(id){
  const p = retailProducts.find(x => x.id === id);
  if(!p) return;
  
  // Also merge into global master product list in localStorage if needed so checkout works seamlessly
  let allProds = JSON.parse(localStorage.getItem("novaAllProductsCache") || "[]");
  if(!allProds.some(x => x.id === id)) {
    allProds.push(p);
    localStorage.setItem("novaAllProductsCache", JSON.stringify(allProds));
  }

  let cart = readCart();
  let item = cart.find(x => x.id === id);
  if(item) item.qty++;
  else cart.push({id: id, qty: 1});
  saveCart(cart);
  updateCartCount();
  toast(p.name + " added to cart.");
}

function toast(s){
  let t = document.getElementById("toast");
  t.textContent = s;
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"), 2400);
}

document.getElementById("retailGrid").innerHTML = retailProducts.map(p => `
  <article class="product">
    <div class="prodimg">
      <span class="shein-discount-badge">-${p.discount}</span>
      <img src="${p.images[0]}" alt="${p.name}">
    </div>
    <div class="prodbody">
      <small style="color:#08774f;font-weight:800">${p.seller}</small>
      <h3>${p.name}</h3>
      <div class="price">${cash(p.price)}</div>
      <button class="btn" onclick="addToRetailCart('${p.id}')">🛒 Add to Cart</button>
    </div>
  </article>
`).join("");

updateCartCount();
</script>

</body>
</html>
