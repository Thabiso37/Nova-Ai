name: Phase 2 Complete Workflow Log Scan

on:
  push:
    branches:
      - feature/metadata-only-inventory-prototype
      - feature/phase2-exact-pair-scanner-candidate
    paths:
      - .github/workflows/phase2-workflow-log-scan.yml
      - phase2/metadata-inventory/tests/test_static_safety.py
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Must be the approved completed Phase 2 metadata inventory workflow run
        required: true
        type: string
      target_source_sha:
        description: Exact approved source commit SHA paired with the run ID
        required: true
        type: string

permissions:
  # Read-only access: scanner never writes to source workflows or repository contents.
  # Candidate branch includes the same scanner workflow checks as the approved prototype branch.
  actions: read
  contents: read

jobs:
  scan-completed-run:
    runs-on: ubuntu-latest
    env:
      APPROVED_BRANCH: "feature/metadata-only-inventory-prototype"
      APPROVED_WORKFLOW_NAME: "Phase 2 Metadata Inventory Prototype"
      APPROVED_WORKFLOW_PATH: ".github/workflows/phase2-metadata-inventory.yml"
    steps:
      - name: Select exact approved source pair
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.target_run_id }}
          DISPATCH_SOURCE_SHA: ${{ inputs.target_source_sha }}
          WORKFLOW_EXECUTION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # BEGIN APPROVED_PAIR_SELECTOR
          if [[ "$EVENT_NAME" == "push" ]]; then
            target_run_id="42652510694"
            target_source_sha="294fa19fac21b5467b9cf2eb0acb428678395575"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$WORKFLOW_EXECUTION_REF" == "refs/heads/feature/phase2-exact-pair-scanner-candidate" ]] || { echo "Manual dispatch is restricted to the candidate branch" >&2; exit 1; }
            target_run_id="$DISPATCH_RUN_ID"
            target_source_sha="$DISPATCH_SOURCE_SHA"
            [[ "$target_run_id" =~ ^[0-9]+$ ]]
            [[ "$target_source_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unsupported trigger event: $EVENT_NAME" >&2
            exit 1
          fi
          case "$target_run_id:$target_source_sha" in
            "42640933100:41c91e5b8be9bb1648eba7ddedbc9ff27ebfabbb"|"42652510694:294fa19fac21b5467b9cf2eb0acb428678395575") ;;
            *) echo "Run ID/source SHA pair is not approved" >&2; exit 1 ;;
          esac
          printf 'target_run_id=%s\n' "$target_run_id" >> "$GITHUB_OUTPUT"
          printf 'target_source_sha=%s\n' "$target_source_sha" >> "$GITHUB_OUTPUT"
          # END APPROVED_PAIR_SELECTOR

      - name: Checkout scanner from selected approved source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.select.outputs.target_source_sha }}
          persist-credentials: false

      - name: Checkout candidate tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate-tests
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run selector regression tests
        run: |
          set -euo pipefail
          python -m unittest \
            test_static_safety.StaticSafetyTests.test_push_always_selects_pair_b \
            test_static_safety.StaticSafetyTests.test_dispatch_accepts_both_exact_approved_pairs \
            test_static_safety.StaticSafetyTests.test_dispatch_rejects_crossed_pairs \
            test_static_safety.StaticSafetyTests.test_dispatch_rejects_malformed_unknown_and_missing_values \
            test_static_safety.StaticSafetyTests.test_selector_rejects_unsupported_events \
            test_static_safety.StaticSafetyTests.test_dispatch_requires_both_inputs \
            test_static_safety.StaticSafetyTests.test_selector_contains_only_exact_approved_pairs
        working-directory: candidate-tests/phase2/metadata-inventory/tests

      - name: Run complete candidate static test suite
        id: static_tests
        run: |
          set -euo pipefail
          python -m unittest discover -s candidate-tests/phase2/metadata-inventory/tests -p 'test_*.py' -v

      - name: Verify pinned scanner source integrity
        id: scanner_integrity
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "806789ebbe64e39af537415718b6b142d9f94e383def200390e6cf075e4ac238" "phase2/metadata-inventory/scan_sensitive.py" \
            "bc76e0af5047a093c093710621f85f1d89f3cb07a8622c6da51dc7088a470233" "phase2/metadata-inventory/secret_patterns.py" \
            | sha256sum --check --strict

      - name: Initialize evidence and verify source run identity
        id: retrieve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.select.outputs.target_run_id }}
          TARGET_SOURCE_SHA: ${{ steps.select.outputs.target_source_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p scan-evidence
          printf '%s\n' "NOT_STARTED" > scan-evidence/retrieval-status.txt
          printf '%s\n' "$TARGET_RUN_ID" > scan-evidence/approved-source-run-id.txt
          printf '%s\n' "$TARGET_SOURCE_SHA" > scan-evidence/approved-source-commit.txt
          printf '%s\n' "$APPROVED_BRANCH" > scan-evidence/approved-source-branch.txt
          printf '%s\n' "$APPROVED_WORKFLOW_NAME" > scan-evidence/approved-source-workflow.txt
          printf '%s\n' "$GITHUB_SHA" > scan-evidence/scanner-workflow-event-commit.txt
          trap 'rc=$?; printf "FAIL (exit %s)\n" "$rc" > scan-evidence/retrieval-status.txt; exit "$rc"' ERR

          target_run_id="$TARGET_RUN_ID"
          target_source_sha="$TARGET_SOURCE_SHA"
          [[ "$target_run_id" =~ ^[0-9]+$ ]]
          [[ "$target_source_sha" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id" > scan-evidence/source-run-metadata.json
          jq -e \
            --arg name "$APPROVED_WORKFLOW_NAME" \
            --arg branch "$APPROVED_BRANCH" \
            --arg sha "$target_source_sha" \
            --arg path "$APPROVED_WORKFLOW_PATH" \
            --argjson id "$target_run_id" \
            '.id == $id and .name == $name and (.path == $path or .path == ($path + "@refs/heads/" + $branch)) and .head_branch == $branch and .head_sha == $sha and .status == "completed" and .conclusion == "success"' \
            scan-evidence/source-run-metadata.json > /dev/null

          gh api --paginate --jq '.jobs[]' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id/jobs?per_page=100" \
            | jq -s '.' > scan-evidence/source-run-jobs.json

          expected_total="$(jq -r '.total_count' < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id/jobs?per_page=1"))"
          actual_total="$(jq 'length' scan-evidence/source-run-jobs.json)"
          [[ "$actual_total" -eq "$expected_total" ]]
          [[ "$actual_total" -gt 0 ]]

          matching_count="$(jq '[.[] | select(.name == "disposable-postgres-17")] | length' scan-evidence/source-run-jobs.json)"
          [[ "$matching_count" -eq 1 ]]
          job_id="$(jq -r '[.[] | select(.name == "disposable-postgres-17")][0].id' scan-evidence/source-run-jobs.json)"
          jq -e --argjson id "$job_id" \
            '.[] | select(.id == $id and .name == "disposable-postgres-17" and .status == "completed" and .conclusion == "success")' \
            scan-evidence/source-run-jobs.json > /dev/null

          if gh run view "$target_run_id" --repo "$GITHUB_REPOSITORY" --job "$job_id" --log > scan-evidence/phase2-job-logs.txt; then
            retrieval_exit_status=0
          else
            retrieval_exit_status=$?
          fi
          printf '%s\n' "$retrieval_exit_status" > scan-evidence/log-download-exit-status.txt
          [[ "$retrieval_exit_status" -eq 0 ]]
          test -s scan-evidence/phase2-job-logs.txt

          printf '%s\n' "$target_run_id" > scan-evidence/scanned-run-id.txt
          printf '%s\n' "$job_id" > scan-evidence/scanned-job-id.txt
          printf '%s\n' "$target_source_sha" > scan-evidence/scanner-source-commit.txt
          sha256sum scan-evidence/phase2-job-logs.txt | awk '{print $1}' > scan-evidence/source-job-log-sha256.txt
          sha256sum phase2/metadata-inventory/scan_sensitive.py phase2/metadata-inventory/secret_patterns.py > scan-evidence/scanner-files-sha256.txt
          git rev-parse HEAD > scan-evidence/checked-out-scanner-commit.txt
          printf '%s\n' "PASS" > scan-evidence/retrieval-status.txt

      - name: Scan complete workflow job logs with pinned scanner
        id: scan
        if: steps.retrieve.outcome == 'success'
        run: |
          set -euo pipefail
          python phase2/metadata-inventory/scan_sensitive.py scan-evidence/phase2-job-logs.txt | tee scan-evidence/workflow-log-scan.txt

      - name: Record scan execution status
        if: always()
        run: |
          set -euo pipefail
          mkdir -p scan-evidence
          if [[ "${{ steps.retrieve.outcome }}" != "success" ]]; then
            printf 'NOT_RUN: retrieval/identity verification outcome=%s\n' "${{ steps.retrieve.outcome }}" > scan-evidence/scan-status.txt
          elif [[ "${{ steps.scan.outcome }}" == "success" ]]; then
            printf '%s\n' "PASS" > scan-evidence/scan-status.txt
          else
            printf 'FAIL: scanner outcome=%s\n' "${{ steps.scan.outcome }}" > scan-evidence/scan-status.txt
          fi

      - name: Upload scan and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-complete-workflow-log-scan
          path: |
            scan-evidence/
            !scan-evidence/phase2-job-logs.txt
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed unless tests, integrity, retrieval and scan all pass
        if: always()
        env:
          RETRIEVAL_OUTCOME: ${{ steps.retrieve.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          STATIC_TEST_OUTCOME: ${{ steps.static_tests.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.scanner_integrity.outcome }}
        run: |
          set -euo pipefail
          [[ "$RETRIEVAL_OUTCOME" == "success" ]]
          [[ "$SCAN_OUTCOME" == "success" ]]
          [[ "$STATIC_TEST_OUTCOME" == "success" ]]
          [[ "$INTEGRITY_OUTCOME" == "success" ]]
