name: NOVAAI Isolated Preview Build Validation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact PR commit SHA to build
        required: true
        type: string
        default: 10de8ec63bf77ec08e0252592251542ad6ad142a
permissions:
  contents: read
concurrency:
  group: novaai-isolated-preview-validation
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview tooling branch and restore exact approved application files
        uses: actions/checkout@v4
        with:
          ref: feature/product-sharing-analytics
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify checked-out commit
        run: |
          git checkout 10de8ec63bf77ec08e0252592251542ad6ad142a -- index.html retail.html seller-motors-houses.html property-details.html novaai-product-sharing.js nearby-search.js novaai-ad-slots.js novaai-share-visits.js service-worker.js
git diff --quiet 10de8ec63bf77ec08e0252592251542ad6ad142a -- index.html retail.html seller-motors-houses.html property-details.html novaai-product-sharing.js nearby-search.js novaai-ad-slots.js novaai-share-visits.js service-worker.js
      - name: Generate fixture-backed isolated preview copy
        run: node scripts/preview/build.mjs
      - name: Run static isolation verification
        run: node scripts/preview/verify.mjs
      - name: Confirm preview build does not publish
        run: |
          test -d preview-dist
          test ! -e .github/workflows/pages.yml
          echo "Build validated locally on runner only; no artifact, URL, Pages deployment or tunnel created."
