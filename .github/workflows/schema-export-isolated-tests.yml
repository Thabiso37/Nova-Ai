name: Isolated schema export tests
on:
  push:
    branches: [feature/production-schema-export]
    paths:
      - '.github/workflows/schema-export-isolated-tests.yml'
      - 'scripts/schema-export/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-17-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: postgres:17.11-bookworm
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated test utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends age=1.1.1-1+b3 jq
          pg_dump --version | grep -F '17.11'
          psql --version | grep -F '17.11'
          age --version | grep -F '1.1.1'
      - name: Run existing writable-primary synthetic suite
        shell: bash
        run: bash scripts/schema-export/test-isolated.sh

  postgres-17-hot-standby:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: postgres:17.11-bookworm
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated test utilities and verify production PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends age=1.1.1-1+b3 jq
          [[ "$(pg_dump --version)" == "pg_dump (PostgreSQL) 17.11" ]]
          [[ "$(psql --version)" == "psql (PostgreSQL) 17.11" ]]
      - name: Build and verify genuine hot standby, security boundary and exports
        shell: bash
        run: bash scripts/schema-export/test-hot-standby.sh
