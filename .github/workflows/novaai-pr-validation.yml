name: NOVAAI PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: novaai-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks and sharing behaviour tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm tested commit and identify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/novaai-pr-changed-files.txt
          echo "Validated PR head: $HEAD_SHA"
          echo "Base snapshot: $BASE_SHA"
          echo "Changed files:"
          cat /tmp/novaai-pr-changed-files.txt
          {
            echo "## NOVAAI PR validation"
            echo
            echo "- **PR head commit:** `$HEAD_SHA`"
            echo "- **Base snapshot:** `$BASE_SHA`"
            echo "- **Checkout:** exact PR head commit (not the synthetic merge ref)"
            echo
            echo "### Changed files"
            sed 's/^/- `/; s/$/`/' /tmp/novaai-pr-changed-files.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t changed_js < <(grep -E '\.m?js$' /tmp/novaai-pr-changed-files.txt || true)
          for file in "${changed_js[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done
          test -f novaai-product-sharing.js
          echo "Checking novaai-product-sharing.js"
          node --check novaai-product-sharing.js
          echo "JavaScript syntax checks passed."

      - name: Validate changed HTML and inline JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import sys

          changed = Path("/tmp/novaai-pr-changed-files.txt").read_text().splitlines()
          html_files = [Path(p) for p in changed if p.lower().endswith((".html", ".htm"))]
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = {}
                  self.inline_scripts = []
                  self._script = None
                  self._script_type = ""
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("id")
                  if value:
                      self.ids.setdefault(value, 0)
                      self.ids[value] += 1
                  if tag.lower() == "script":
                      self._script_type = attrs.get("type", "").lower().strip()
                      self._script = [] if not attrs.get("src") and self._script_type in ("", "text/javascript", "application/javascript", "module") else None
              def handle_data(self, data):
                  if self._script is not None:
                      self._script.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self._script is not None:
                      self.inline_scripts.append("".join(self._script))
                      self._script = None
          failures = []
          inline_count = 0
          for path in html_files:
              if not path.is_file():
                  failures.append(f"Missing changed HTML file: {path}")
                  continue
              parser = Audit()
              parser.feed(path.read_text(encoding="utf-8"))
              parser.close()
              duplicates = sorted(k for k, count in parser.ids.items() if count > 1)
              if duplicates:
                  failures.append(f"{path}: duplicate IDs: {', '.join(duplicates)}")
              for index, source in enumerate(parser.inline_scripts):
                  if not source.strip():
                      continue
                  inline_count += 1
                  temp = Path("/tmp") / f"novaai-inline-{inline_count}.js"
                  temp.write_text(source, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(temp)], text=True, capture_output=True)
                  if result.returncode:
                      failures.append(f"{path}: inline script {index + 1} syntax error:\\n{result.stderr}")
          print(f"Changed HTML files checked: {len(html_files)}")
          print(f"Inline JavaScript blocks syntax-checked: {inline_count}")
          if failures:
              print("\\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("Changed HTML validation passed; no duplicate IDs found.")
          PY

      - name: Test native sharing, cancellation and clipboard without analytics dependencies
        run: |
          set -euo pipefail
          cat > /tmp/novaai-product-sharing.test.cjs <<'JS'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          function harness(overrides = {}) {
            const requests = [];
            const prompts = [];
            const listeners = {};
            const button = {
              attrs: { 'aria-label': 'Share listing' },
              classList: { add() {}, remove() {} },
              getAttribute(name) { return this.attrs[name] || null; },
              setAttribute(name, value) { this.attrs[name] = value; }
            };
            const document = {
              addEventListener(type, fn) { listeners[type] = fn; },
              createElement() { return { textContent: '' }; },
              head: { appendChild() {} }
            };
            const navigator = { share: overrides.share, clipboard: overrides.clipboard };
            const window = {
              crypto: { randomUUID: () => '11111111-2222-4333-8444-555555555555' },
              isSecureContext: overrides.secure !== false,
              prompt: (...args) => prompts.push(args)
            };
            const context = {
              window, document, navigator,
              fetch: async (...args) => { requests.push(args); return { ok: true, status: 200 }; },
              console: { warn() {} },
              setTimeout() { return 1; },
              clearTimeout() {}
            };
            vm.runInNewContext(fs.readFileSync('novaai-product-sharing.js', 'utf8'), context);
            return { api: window.NOVAAIProductShare, requests, prompts, button, listeners };
          }
          const valid = {
            title: 'Test listing', price: 'R100', url: 'https://example.test/item/42',
            productId: '42', marketplace: 'retail', shareLocation: 'product_card'
          };
          async function settle() { await new Promise(resolve => setImmediate(resolve)); }

          test('native share succeeds and opens the platform share sheet without network analytics', async () => {
            const h = harness({ share: async () => {} });
            assert.equal(await h.api.share({ ...valid, button: h.button }), true);
            await settle();
            assert.equal(h.requests.length, 0);
            assert.equal(h.prompts.length, 0);
          });

          test('native share cancellation returns false without opening fallback or making requests', async () => {
            const h = harness({ share: async () => { const error = new Error('cancelled'); error.name = 'AbortError'; throw error; } });
            assert.equal(await h.api.share(valid), false);
            await settle();
            assert.equal(h.requests.length, 0);
            assert.equal(h.prompts.length, 0);
          });

          test('clipboard fallback succeeds without analytics network requests', async () => {
            let copied = '';
            const h = harness({ secure: true, clipboard: { writeText: async value => { copied = value; } } });
            assert.equal(await h.api.share(valid), true);
            await settle();
            assert.match(copied, /View on NOVAAI MARKET/);
            assert.equal(h.requests.length, 0);
          });

          test('manual prompt fallback is available when clipboard is unavailable', async () => {
            const h = harness({ secure: false });
            assert.equal(await h.api.share(valid), false);
            await settle();
            assert.equal(h.prompts.length, 1);
            assert.equal(h.requests.length, 0);
          });

          test('sharing helper contains no Supabase analytics endpoint or event recorder', () => {
            const source = fs.readFileSync('novaai-product-sharing.js', 'utf8');
            assert.doesNotMatch(source, /supabase\.co\/functions|record-novaai-product-share|function record\(/i);
          });
          JS
          node --test /tmp/novaai-product-sharing.test.cjs

      - name: Publish concise validation result
        if: always()
        run: |
          {
            echo
            echo "### Validation outcome"
            echo "- JavaScript syntax, changed HTML/duplicate-ID checks, and sharing behaviour tests are reported in the job steps above."
            echo "- This workflow does not deploy, access Supabase credentials, or execute database migrations."
          } >> "$GITHUB_STEP_SUMMARY"
