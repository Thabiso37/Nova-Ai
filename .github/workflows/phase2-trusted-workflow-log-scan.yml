name: Phase 2 Trusted Workflow Log Scan
on:
  workflow_run:
    workflows: ["Phase 2 Metadata Inventory Prototype"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [phase2-approved-log-scan]
permissions:
  actions: read
  contents: read
concurrency:
  group: phase2-trusted-log-scan-${{ github.event.workflow_run.id || github.event.client_payload.target_run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  trusted-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_ACTOR: ${{ github.actor }}
      EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      DISPATCH_RUN_ID: ${{ github.event.client_payload.target_run_id }}
      DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.target_source_sha }}
    steps:
      - name: Checkout trusted default-branch orchestrator source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Thabiso37/Nova-Ai
          ref: ${{ github.sha }}
          path: trusted-orchestrator-source
          persist-credentials: false
      - name: Checkout only the pinned trusted scanner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Thabiso37/Nova-Ai
          ref: 294fa19fac21b5467b9cf2eb0acb428678395575
          path: approved-scanner-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Execute fail-closed trusted scanner
        id: scan_evidence
        run: python trusted-orchestrator-source/trusted-log-scan/trusted_scan.py
      - name: Validate evidence allowlist and stage sanitized artifact
        id: stage_evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,sys
          sys.path.insert(0,"trusted-orchestrator-source/trusted-log-scan")
          import trusted_scan
          e=pathlib.Path("trusted-evidence")
          raw=e/"raw-source-job-logs.txt"
          trusted_scan.stage_sanitized_artifact(e,raw,pathlib.Path("trusted-evidence-upload"))
          PY
      - name: Upload sanitized evidence only
        if: always() && steps.stage_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-f02-trusted-scan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trusted-evidence-upload/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce scanner and evidence final gate
        if: always()
        env:
          SCANNER_OUTCOME: ${{ steps.scan_evidence.outcome }}
          STAGING_OUTCOME: ${{ steps.stage_evidence.outcome }}
        run: |
          python - <<'PY'
          import os, sys
          if os.environ.get("SCANNER_OUTCOME") != "success":
              print("scanner_step_not_successful", file=sys.stderr)
              sys.exit(1)
          if os.environ.get("STAGING_OUTCOME") != "success":
              print("evidence_staging_not_successful", file=sys.stderr)
              sys.exit(1)
          print("F-02 evidence final gate passed")
          PY
