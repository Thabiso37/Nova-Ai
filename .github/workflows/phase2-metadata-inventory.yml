name: Phase 2 Metadata Inventory Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - feature/metadata-only-inventory-prototype
  pull_request:
    branches:
      - main

concurrency:
  group: phase2-metadata-inventory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disposable-postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: admin-test-only
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: admin-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client and Python dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r phase2/metadata-inventory/requirements.txt
      - name: Verify disposable server version
        run: psql -X -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -Atc "SHOW server_version" | grep -E '^17\.11([ -]|$)'
      - name: Create synthetic database fixtures
        run: psql -X -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f phase2/metadata-inventory/fixtures/bootstrap.sql
      - name: Run static tests
        run: python -m unittest discover -s phase2/metadata-inventory/tests -v
      - name: Run restricted inventory
        env:
          INVENTORY_DSN: "host=127.0.0.1 port=5432 dbname=inventory_test user=novaai_inventory_inspector password=local-test-only"
        run: python phase2/metadata-inventory/inventory.py --output inventory.json
      - name: Discover unsupported object families as restricted inspector
        env:
          INVENTORY_DSN: "host=127.0.0.1 port=5432 dbname=inventory_test user=novaai_inventory_inspector password=local-test-only"
        run: set -o pipefail; python phase2/metadata-inventory/detect_unsupported.py | tee unsupported.json
      - name: Run runtime negative security tests as restricted inspector
        env:
          INVENTORY_DSN: "host=127.0.0.1 port=5432 dbname=inventory_test user=novaai_inventory_inspector password=local-test-only"
        run: set -o pipefail; python phase2/metadata-inventory/runtime_security.py | tee runtime-security.json
      - name: Generate independent disposable schema-only baseline
        run: pg_dump -h 127.0.0.1 -U postgres -d inventory_test --schema-only --schema=novaai_app --schema=novaai_private --file=baseline.sql
      - name: Generate extension-only disposable baseline
        run: pg_dump -h 127.0.0.1 -U postgres -d inventory_test --schema-only --extension=plpgsql --file=baseline-extensions.sql
      - name: Scan generated outputs for canaries and secret patterns
        run: python phase2/metadata-inventory/validate_artifacts.py inventory.json baseline.sql baseline-extensions.sql runtime-security.json unsupported.json
      - name: Compare baseline object identities
        run: python phase2/metadata-inventory/compare_baseline.py inventory.json baseline.sql unsupported.json baseline-extensions.sql
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-metadata-inventory-report
          path: |
            inventory.json
            baseline.sql
            baseline-extensions.sql
            runtime-security.json
            unsupported.json
          if-no-files-found: warn
