name: Phase 2 F-02 Trusted Scanner Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "trusted-log-scan/**"
      - ".github/workflows/phase2-trusted-workflow-log-scan.yml"
      - ".github/workflows/phase2-f02-tests.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout only the approved scanner source for canary integration tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Thabiso37/Nova-Ai
          ref: 294fa19fac21b5467b9cf2eb0acb428678395575
          path: approved-scanner-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Execute adversarial behavioral tests
        run: python -m unittest discover -s trusted-log-scan/tests -v
